# Byte-level GPT-2 on this repository's source code. CPU-friendly defaults;
# for GPT-2 small on a GPU: --set model.size=small --set data.seq_len=512
main:
  experiment_name: gpt2-bytes
  output_dir: ./outputs
  seed: 42

model:            # free-form: passed to create_gpt2_model(size, **rest)
  size: tiny      # tiny | small | medium | large
  vocab_size: 256 # byte-level tokens

data:             # free-form: read by train_gpt2.py
  seq_len: 128
  paths: []       # text files / globs; empty -> this repository's Python sources

training:
  batch_size: 16           # per-device micro-batch
  global_batch_size: 32    # accumulation is derived from the world size, so resizing keeps this fixed
  learning_rate: 1e-3
  weight_decay: 0.1
  warmup_steps: 20
  lr_scheduler: cosine
  min_lr_ratio: 0.1
  max_steps: 300
  max_grad_norm: 1.0
  log_interval: 10
  eval_interval: 100
  eval_max_batches: 20
  num_workers: 0

distributed:
  strategy: ddp                 # fsdp for sharded training (CUDA only)
  mixed_precision: true         # CUDA only; ignored on CPU
  mixed_precision_dtype: bf16   # use fp16 on GPUs without bf16 (e.g. T4, V100)
  wrap_modules: [GPT2Block]     # FSDP units / activation-checkpoint boundaries
  activation_checkpointing: false

checkpoint:
  save_interval_steps: 100
  keep_last_n: 3
  async_save: true

elastic:
  nproc_per_node: 1
  max_restarts: 3

fault_tolerance:
  handle_signals: true
